<div class="arch-page">

  <header class="arch-toolbar">
    <button class="arch-icon-btn" (click)="goBack()" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="arch-titles">
      <h1>Reports &amp; Insights</h1>
      <p>Directory performance at a glance</p>
    </div>
  </header>

  <div class="arch-stat-grid">
    <div class="arch-stat-card">
      <span class="arch-stat-icon icon-accent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V8l9-5.5L21 8v13" stroke-linejoin="round"/><path d="M9 21v-6h6v6"/></svg></span>
      <span class="arch-stat-body"><span class="arch-stat-label">Total Architects</span><span class="arch-stat-value">{{ totalArchitects }}</span></span>
    </div>
    <div class="arch-stat-card">
      <span class="arch-stat-icon icon-success"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg></span>
      <span class="arch-stat-body"><span class="arch-stat-label">Onboarded</span><span class="arch-stat-value">{{ onboardedCount }}</span></span>
    </div>
    <div class="arch-stat-card">
      <span class="arch-stat-icon icon-info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>
      <span class="arch-stat-body"><span class="arch-stat-label">Conversion Rate</span><span class="arch-stat-value">{{ conversionRate }}</span></span>
    </div>
    <div class="arch-stat-card">
      <span class="arch-stat-icon icon-warning"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
      <span class="arch-stat-body"><span class="arch-stat-label">Pipeline Value</span><span class="arch-stat-value">₹{{ totalBusinessValue | number }}</span></span>
    </div>
  </div>

  <div class="report-grid" *ngIf="!isLoading">
    <div class="arch-card">
      <div class="arch-card-header"><h2>Lead Status</h2></div>
      <div echarts [options]="statusChartOptions" class="report-chart"></div>
    </div>
    <div class="arch-card">
      <div class="arch-card-header"><h2>Top Cities</h2></div>
      <div echarts [options]="cityChartOptions" class="report-chart"></div>
    </div>
    <div class="arch-card">
      <div class="arch-card-header"><h2>Business Pipeline</h2></div>
      <div echarts [options]="businessChartOptions" class="report-chart"></div>
    </div>
  </div>

  <div class="arch-skeleton" style="height:300px" *ngIf="isLoading"></div>

</div>
