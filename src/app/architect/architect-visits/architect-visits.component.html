<div class="arch-page">

  <header class="arch-toolbar">
    <button class="arch-icon-btn" (click)="goBack()" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="arch-titles">
      <h1>Visit Tracker</h1>
      <p>Office &amp; showroom visits logged across all architects</p>
    </div>
  </header>

  <div class="arch-card">
    <div class="arch-tabs">
      <button class="arch-tab" [class.active]="activeType==='Office Visit'" (click)="setType('Office Visit')">Office Visit ({{ officeCount }})</button>
      <button class="arch-tab" [class.active]="activeType==='Showroom Visit'" (click)="setType('Showroom Visit')">Showroom Visit ({{ showroomCount }})</button>
    </div>

    <div style="padding:14px 18px">
      <div class="visit-list" *ngIf="!isLoading && visibleVisits.length; else emptyOrLoading">
        <div class="visit-item" *ngFor="let v of visibleVisits">
          <div class="visit-body" (click)="openArchitect(v.architectId)">
            <span class="visit-name">{{ v.architectName }}</span>
            <span class="visit-meta">{{ v.date }} <span *ngIf="v.time">{{ v.time }}</span> <span *ngIf="v.team?.length">&middot; Team: {{ v.team.join(', ') }}</span></span>
            <span class="visit-notes" *ngIf="v.notes">{{ v.notes }}</span>
          </div>
          <button class="row-del-btn" (click)="remove(v)">&times;</button>
        </div>
      </div>
      <ng-template #emptyOrLoading>
        <div class="arch-skeleton" style="height:120px" *ngIf="isLoading"></div>
        <div class="arch-empty" *ngIf="!isLoading">No {{ activeType.toLowerCase() }} history yet.</div>
      </ng-template>
    </div>
  </div>

</div>
